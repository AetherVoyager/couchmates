name: couchmates
description: "A beautiful Plex and Jellyfin client for Flutter"
publish_to: "none"
version: 0.7.3+18

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  http: ^1.2.0
  couchmates_core:
    path: ../core
  url_launcher: ^6.3.0
  logger: ^2.7.0
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  provider: ^6.1.2
  os_media_controls:
    git:
      url: https://github.com/edde746/media_controls
      ref: a27208e641790029ac54d825b97508575caee1a7
  path_provider: ^2.1.0
  path: ^1.9.0
  file_picker: ^13.4.1
  collection: ^1.18.0
  freezed_annotation: ^3.1.0
  openwatchparty: ^1.1.0
  livekit_client: ^2.14.0
  # The chat composer's emoji picker.
  emoji_picker_flutter: ^4.5.4

dev_dependencies:
  archive: ^4.0.9
  # scripts/release and scripts/codegen hash files with it.
  crypto: ^3.0.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mgenware_dart_lints: ^8.0.0
  fake_async: ^1.3.3
  stream_channel: ^2.1.4
  build_runner: ^2.13.0
  # Used by explicit check-unused CI steps; analyzer plugin disabled.
  dart_code_linter: ^4.1.8
  shared_preferences_platform_interface: ^2.4.0
  path_provider_platform_interface: ^2.1.0
  # Exercise vendored desktop preference stores against real file I/O,
  # including #1732 repair and atomic writes.
  shared_preferences_linux: ^2.4.1
  shared_preferences_windows: ^2.4.1
  path_provider_linux: ^2.2.1
  path_provider_windows: ^2.3.0
  plugin_platform_interface: ^2.1.0
  freezed: ^4.0.3
  analyzer: ^14.0.0

dependency_overrides:
  # Vendored 2.4.1: atomic replacement prevents upstream #1732 corruption.
  shared_preferences_windows:
    path: packages/shared_preferences_windows
  shared_preferences_linux:
    path: packages/shared_preferences_linux
flutter:
  uses-material-design: true
  assets:
    - assets/couchmates.png
    - assets/licenses/SpatialAudioBridge.txt
    - assets/licenses/BricolageGrotesque-OFL.txt
    - assets/trakt_circlemark.svg
    - assets/mal_mark.svg
    - assets/anilist_mark.svg
    - assets/simkl_mark.svg
    - assets/seerr_mark.svg
    - assets/mdblist_mark.svg
    - assets/go-noto-current-regular.ttf
    - assets/go-noto-kurrent-hangul.ttf
    # Intro/credits chapter classifier; scripts/codegen/train_chapter_marker_model.py writes it.
    - assets/chapter_marker_model.bin
    - assets/shaders/nvscaler/
    - assets/shaders/artcnn/
    - assets/shaders/anime4k/
    - assets/player_icons/
    - assets/rating_icons/
    # App icon picker thumbnails; scripts/codegen/generate_app_icons.py renders them from
    # assets/app_icons/source, which stays out of the bundle.
    - assets/app_icons/previews/
  # Registered as UI font families so the Linux build, whose fontconfig may
  # lack CJK fonts, can fall back to the bundled subtitle fonts (mono_theme).
  fonts:
    # Display face for headings (SIL OFL, assets/licenses/BricolageGrotesque-OFL.txt).
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Go Noto Current
      fonts:
        - asset: assets/go-noto-current-regular.ttf
    - family: Go Noto Current Hangul
      fonts:
        - asset: assets/go-noto-kurrent-hangul.ttf
