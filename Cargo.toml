[workspace]
resolver = "3"
members = ["core", "hub/core", "hub/ui", "hub/worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
couchmates-core = { path = "core" }
couchmates-hub-core = { path = "hub/core" }
couchmates-hub-ui = { path = "hub/ui" }

aes-gcm = "0.11.1"
base64 = "0.23.1"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hex = "0.4.3"
hmac = "0.13.0"
js-sys = "0.3.107"
maud = "0.27.0"
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
url = "2.5.9"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Crypto", "SubtleCrypto", "CryptoKey", "WorkerGlobalScope", "Pbkdf2Params"] }
worker = { version = "0.9.0", features = ["d1"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
